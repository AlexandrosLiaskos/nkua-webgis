name: nkua-webgis

services:
  db:
    image: postgis/postgis:17-3.5-alpine
    container_name: nkua-webgis-db
    environment:
      POSTGRES_USER: webgis_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: webgis
      POSTGRES_INITDB_ARGS: --data-checksums
      WEBGIS_API_PASSWORD: ${WEBGIS_API_PASSWORD:?required}
    command:
      - postgres
      - -c
      - max_connections=60
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - random_page_cost=1.1
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
    shm_size: 256mb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/001-init.sh:/docker-entrypoint-initdb.d/001-init.sh:ro
      - ./infra/db/001-schema.sql:/docker-entrypoint-initdb.d/sql/001-schema.sql:ro
      - ./data:/docker-entrypoint-initdb.d/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webgis_owner -d webgis"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks:
      - backend
    restart: unless-stopped

  api:
    image: postgrest/postgrest:v16.2
    container_name: nkua-webgis-api
    environment:
      PGRST_DB_URI: postgres://webgis_authenticator:${WEBGIS_API_PASSWORD:?required}@db:5432/webgis
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: webgis_anon
      PGRST_DB_POOL: "20"
      PGRST_DB_POOL_ACQUISITION_TIMEOUT: "5"
      PGRST_DB_POOL_MAX_LIFETIME: "1800"
      PGRST_DB_PREPARED_STATEMENTS: "true"
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_OPENAPI_MODE: disabled
      PGRST_LOG_LEVEL: error
      PGRST_ADMIN_SERVER_PORT: "3001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  counter:
    image: python:3.12-alpine
    container_name: nkua-webgis-counter
    command:
      - python
      - /app/visit_counter.py
      - --host
      - 0.0.0.0
      - --port
      - "8766"
      - --count-file
      - /app/data/visits.json
    expose:
      - "8766"
    volumes:
      - ./infra/counter/visit_counter.py:/app/visit_counter.py:ro
      - /opt/nkua-webgis/visits:/app/data
      # Count files of the other projects on this server, read-only, for the visit summary.
      - /opt/evelpidou/visits:/app/linked/evelpidou:ro
      - /opt/nepal-flood-2026/data:/app/linked/nepal-flood-2026:ro
      - /opt/nepal-flood-2026-catalogue/data:/app/linked/nepal-flood-2026-catalogue:ro
      - /opt/geological-museum-apeiranthos/visits:/app/linked/geological-museum-apeiranthos:ro
      - /opt/ancient-greek-wonders/data/visits:/app/linked/ancient-greek-wonders:ro
      - /opt/lynkeus/data/visits:/app/linked/lynkeus:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    user: "65534:65534"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/healthz', timeout=3).read()"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - backend
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nkua-webgis-web
    volumes:
      - /opt/nkua-webgis/static/current/sites:/srv/sites:ro
      - /opt/nkua-webgis/static/current/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_started
      counter:
        condition: service_healthy
    networks:
      - backend
      - nkua_proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

networks:
  backend:
    internal: true
  nkua_proxy:
    external: true
    name: nkua-proxy

volumes:
  pgdata:
