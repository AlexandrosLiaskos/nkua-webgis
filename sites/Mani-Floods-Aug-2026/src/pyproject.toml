[project]
name = "mani-floods-simulation"
version = "0.1.0"
description = "Modular multi-physics flood simulation framework for Mani August 2026 flash flood event"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "cdsapi>=0.7.0",
    "pystac-client>=0.8.0",
    "copernicusmarine>=1.0.0",
    "pyproj>=3.6.0",
    "matplotlib>=3.10.9",
    "tifffile>=2025.5.10",
    "python-docx>=1.2.0",
    "rasterio>=1.4.4",
    "geopandas>=1.1.4",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v"
testpaths = ["tests"]
pythonpath = ["."]

