worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;
    etag on;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types application/json application/javascript application/geo+json text/css text/plain text/xml image/svg+xml;

    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_cache_path /var/cache/nginx/webgis-api
        levels=1:2
        keys_zone=webgis_api_cache:20m
        max_size=256m
        inactive=1h
        use_temp_path=off;

    limit_req_zone $binary_remote_addr zone=webgis_api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=webgis_visit_limit:10m rate=2r/s;

    # Dataset protection (16 November 2026): a stricter limit for the functions
    # that return one full record (api_<dataset>_details). The visitor address is
    # the last entry of X-Forwarded-For, which the front proxy writes itself; the
    # connection address is used when the header is absent.
    map $http_x_forwarded_for $webgis_visitor_addr {
        default $remote_addr;
        "~(?<webgis_forwarded_last>[0-9A-Fa-f.:]+)\s*$" $webgis_forwarded_last;
    }
    # The key is empty for every other request, so only detail requests are counted.
    map $uri $webgis_detail_key {
        default "";
        "~^(?:/webgis-api)?/rpc/api_(?:lagoons|floods|beachrocks|tombolos)_details/?$" $webgis_visitor_addr;
    }
    limit_req_zone $webgis_detail_key zone=webgis_detail_limit:10m rate=10r/m;

    # Visit summary and visit recording for sites hosted elsewhere (16 November 2026).
    # Reads are limited for each visitor address. Recorded visits (POST) are limited
    # for each visitor address and also in total, as the page counters above.
    map $request_method $webgis_visits_post_addr {
        default "";
        POST $webgis_visitor_addr;
    }
    map $request_method $webgis_visits_post_any {
        default "";
        POST all;
    }
    limit_req_zone $webgis_visitor_addr zone=webgis_visits_read_limit:10m rate=20r/s;
    limit_req_zone $webgis_visits_post_addr zone=webgis_visits_post_limit:10m rate=20r/m;
    limit_req_zone $webgis_visits_post_any zone=webgis_visits_post_total:1m rate=2r/s;

    proxy_cache_path /var/cache/nginx/webgis-visits
        levels=1
        keys_zone=webgis_visits_cache:1m
        max_size=8m
        inactive=10m
        use_temp_path=off;

    server {
        listen 80;
        root /srv/sites;
        index index.html;
        port_in_redirect off;
        absolute_redirect off;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location ^~ /floods/data/hanze/ {
            types {
                application/geo+json geojson;
                application/json json;
                application/x-ndjson jsonl;
            }
            try_files $uri =404;
        }

        location ^~ /webgis-api/ {
            limit_except GET HEAD { deny all; }
            limit_req zone=webgis_api_limit burst=60 nodelay;
            # One-record detail requests: 150 at once, then 10 a minute for each visitor address.
            limit_req zone=webgis_detail_limit burst=150 nodelay;

            set $postgrest http://nkua-webgis-api:3000;
            rewrite ^/webgis-api/(.*)$ /$1 break;
            proxy_pass $postgrest;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;

            proxy_cache webgis_api_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_key "$request_method$request_uri";
            proxy_cache_lock on;
            proxy_cache_background_update on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_valid 200 206 10m;
            proxy_cache_valid 404 1m;

            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=300, stale-while-revalidate=3600" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
        }

        # Visit summary of all sites: public aggregate numbers, answer kept for 60 s.
        location = /api/visits/summary {
            access_log off;
            limit_except GET { deny all; }
            limit_req zone=webgis_visits_read_limit burst=60 nodelay;
            limit_req_status 429;
            set $webgis_visits http://nkua-webgis-counter:8766;
            proxy_pass $webgis_visits;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_cache webgis_visits_cache;
            proxy_cache_key "visits-summary";
            proxy_cache_valid 200 60s;
            proxy_cache_lock on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        }

        # Visit counter of each site: GET reads the number, POST records one visit.
        # The counter accepts a POST only for a known site and from the origins of that site.
        location ^~ /api/visits/ {
            access_log off;
            limit_except GET POST OPTIONS { deny all; }
            limit_req zone=webgis_visits_read_limit burst=60 nodelay;
            limit_req zone=webgis_visits_post_limit burst=20 nodelay;
            limit_req zone=webgis_visits_post_total burst=10 nodelay;
            limit_req_status 429;
            client_max_body_size 1k;
            set $webgis_visits http://nkua-webgis-counter:8766;
            proxy_pass $webgis_visits;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Content-Length $content_length;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
        }

        # Visit counter of each WebGIS page. nginx looks the counter up through the
        # resolver on each request, so a recreated counter is found without a reload.
        location = /api/page-summary {
            access_log off;
            limit_except GET POST { deny all; }
            limit_req zone=webgis_visit_limit burst=5 nodelay;
            client_max_body_size 1k;
            set $webgis_visits http://nkua-webgis-counter:8766;
            proxy_pass $webgis_visits/api/visit/geocollections;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Content-Length $content_length;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
        }

        location = /landslides/api/page-summary {
            access_log off;
            limit_except GET POST { deny all; }
            limit_req zone=webgis_visit_limit burst=5 nodelay;
            client_max_body_size 1k;
            set $webgis_visits http://nkua-webgis-counter:8766;
            proxy_pass $webgis_visits/api/visit/landslides;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Content-Length $content_length;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
        }

        location = /tsunamis/api/page-summary {
            access_log off;
            limit_except GET POST { deny all; }
            limit_req zone=webgis_visit_limit burst=5 nodelay;
            client_max_body_size 1k;
            set $webgis_visits http://nkua-webgis-counter:8766;
            proxy_pass $webgis_visits/api/visit/tsunamis;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Content-Length $content_length;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
        }

        location = /wildfires/api/page-summary {
            access_log off;
            limit_except GET POST { deny all; }
            limit_req zone=webgis_visit_limit burst=5 nodelay;
            client_max_body_size 1k;
            set $webgis_visits http://nkua-webgis-counter:8766;
            proxy_pass $webgis_visits/api/visit/wildfires;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Content-Length $content_length;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
        }

        location = /earthquakes/api/page-summary {
            access_log off;
            limit_except GET POST { deny all; }
            limit_req zone=webgis_visit_limit burst=5 nodelay;
            client_max_body_size 1k;
            set $webgis_visits http://nkua-webgis-counter:8766;
            proxy_pass $webgis_visits/api/visit/earthquakes;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Content-Length $content_length;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
        }

        location = /mani-floods-2026/api/page-summary {
            access_log off;
            limit_except GET POST { deny all; }
            limit_req zone=webgis_visit_limit burst=5 nodelay;
            client_max_body_size 1k;
            set $webgis_visits http://nkua-webgis-counter:8766;
            proxy_pass $webgis_visits/api/visit/mani-floods-2026;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Content-Length $content_length;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
        }

        location = /cyprus-irrigation-2026/api/page-summary {
            access_log off;
            limit_except GET POST { deny all; }
            limit_req zone=webgis_visit_limit burst=5 nodelay;
            client_max_body_size 1k;
            set $webgis_visits http://nkua-webgis-counter:8766;
            proxy_pass $webgis_visits/api/visit/cyprus-irrigation-2026;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Content-Length $content_length;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
        }

        location = /floods/api/page-summary {
            access_log off;
            limit_except GET POST { deny all; }
            limit_req zone=webgis_visit_limit burst=5 nodelay;
            client_max_body_size 1k;
            set $webgis_visits http://nkua-webgis-counter:8766;
            proxy_pass $webgis_visits/api/visit/floods;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Content-Length $content_length;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
        }

        location = /lagoons/api/page-summary {
            access_log off;
            limit_except GET POST { deny all; }
            limit_req zone=webgis_visit_limit burst=5 nodelay;
            client_max_body_size 1k;
            set $webgis_visits http://nkua-webgis-counter:8766;
            proxy_pass $webgis_visits/api/visit/lagoons;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Content-Length $content_length;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
        }

        location = /beachrocks/api/page-summary {
            access_log off;
            limit_except GET POST { deny all; }
            limit_req zone=webgis_visit_limit burst=5 nodelay;
            client_max_body_size 1k;
            set $webgis_visits http://nkua-webgis-counter:8766;
            proxy_pass $webgis_visits/api/visit/beachrocks;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Content-Length $content_length;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
        }

        location = /tombolos/api/page-summary {
            access_log off;
            limit_except GET POST { deny all; }
            limit_req zone=webgis_visit_limit burst=5 nodelay;
            client_max_body_size 1k;
            set $webgis_visits http://nkua-webgis-counter:8766;
            proxy_pass $webgis_visits/api/visit/tombolos;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Content-Length $content_length;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
        }

        location = /Κακοκαιρία-Φεβ-2026/api/page-summary {
            access_log off;
            limit_except GET POST { deny all; }
            limit_req zone=webgis_visit_limit burst=5 nodelay;
            client_max_body_size 1k;
            set $webgis_visits http://nkua-webgis-counter:8766;
            proxy_pass $webgis_visits/api/visit/storm;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Content-Length $content_length;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
        }

        location = /landslides { return 308 /landslides/; }
        location ^~ /landslides/ { try_files $uri $uri/ =404; }
        location = /tsunamis { return 308 /tsunamis/; }
        location ^~ /tsunamis/ { try_files $uri $uri/ =404; }
        location = /wildfires { return 308 /wildfires/; }
        location ^~ /wildfires/ { try_files $uri $uri/ =404; }
        location = /earthquakes { return 308 /earthquakes/; }
        location ^~ /earthquakes/ { try_files $uri $uri/ =404; }
        # Independent research catalogue builder and generated catalogues.
        location = /prisma-builder { absolute_redirect off; return 308 /prisma-builder/$is_args$args; }
        location ^~ /prisma-builder/ { try_files $uri $uri/ =404; }
        location ^~ /catalogues/ { try_files $uri $uri/ =404; }
        location = /Κακοκαιρία-Φεβ-2026/prisma-builder { absolute_redirect off; return 308 /prisma-builder/$is_args$args; }
        location = /Κακοκαιρία-Φεβ-2026/prisma-builder/catalogues { absolute_redirect off; return 308 /catalogues/$is_args$args; }
        location ^~ /Κακοκαιρία-Φεβ-2026/prisma-builder/catalogues/ {
            absolute_redirect off;
            rewrite ^/Κακοκαιρία-Φεβ-2026/prisma-builder/catalogues/(.*)$ /catalogues/$1 permanent;
        }
        location ^~ /Κακοκαιρία-Φεβ-2026/prisma-builder/ {
            absolute_redirect off;
            rewrite ^/Κακοκαιρία-Φεβ-2026/prisma-builder/(.*)$ /prisma-builder/$1 permanent;
        }

        location = /mani-floods-2026 { return 308 /mani-floods-2026/; }
        location ^~ /mani-floods-2026/media/ {
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            add_header X-Content-Type-Options nosniff always;
        }
        location ^~ /mani-floods-2026/ { try_files $uri $uri/ =404; }
# Mani August 2026 Flash Flood Research Publication Repositories (Code & Open Data)
        location = /Mani-Floods-Aug-2026 { absolute_redirect off; return 308 https://$host/Mani-Floods-Aug-2026/; }
        location = /Mani-Floods-Aug-2026/src { absolute_redirect off; return 308 https://$host/Mani-Floods-Aug-2026/src/; }
        location = /Mani-Floods-Aug-2026/data { absolute_redirect off; return 308 https://$host/Mani-Floods-Aug-2026/data/; }
        location ^~ /Mani-Floods-Aug-2026/ {
            try_files $uri $uri/ =404;
        }

        # Case-insensitive / lowercase alias
        location = /mani-floods-aug-2026 { absolute_redirect off; return 308 https://$host/Mani-Floods-Aug-2026/; }
        location = /mani-floods-aug-2026/src { absolute_redirect off; return 308 https://$host/Mani-Floods-Aug-2026/src/; }
        location = /mani-floods-aug-2026/data { absolute_redirect off; return 308 https://$host/Mani-Floods-Aug-2026/data/; }
        location ^~ /mani-floods-aug-2026/ {
            rewrite ^/mani-floods-aug-2026/(.*)$ /Mani-Floods-Aug-2026/$1 permanent;
        }

        location = /cyprus-irrigation-2026 { return 308 /cyprus-irrigation-2026/; }
        location ^~ /cyprus-irrigation-2026/ { try_files $uri $uri/ =404; }
        location = /floods { return 308 /floods/; }
        location = /lagoons { return 308 /lagoons/; }
        location = /beachrocks { return 308 /beachrocks/; }
        location = /tombolos { return 308 /tombolos/; }
        location = /Κακοκαιρία-Φεβ-2026 { return 308 /Κακοκαιρία-Φεβ-2026/; }

        location ^~ /floods/ { try_files $uri $uri/ =404; }
        location ^~ /lagoons/ { try_files $uri $uri/ =404; }
        location ^~ /beachrocks/ { try_files $uri $uri/ =404; }
        location ^~ /tombolos/ { try_files $uri $uri/ =404; }
        location ^~ /Κακοκαιρία-Φεβ-2026/ { try_files $uri $uri/ =404; }
        location ^~ /webgis-shared/ { try_files $uri =404; }

        location = / { try_files /index.html =404; }
        location = /index.html { try_files $uri =404; }
        location = /site.webmanifest { try_files $uri =404; }
        location = /robots.txt { try_files $uri =404; }

        location ~* \.(?:css|js|json|geojson|png|jpe?g|gif|webp|svg|ico|woff2?|ttf)$ {
            try_files $uri =404;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
            add_header X-Content-Type-Options nosniff always;
        }

        location / { return 404; }
    }

    # Read-only pass-through for the visit summary: the page-view total of the
    # WebGIS Builder front page (webgis.nkua.cloud). Only the visit counter of this
    # project asks it; the front web server does not route to this port.
    server {
        listen 8081;
        access_log off;

        location = /linked/webgis-builder {
            limit_except GET { deny all; }
            set $webgis_builder http://webgis-platform:8000;
            rewrite ^ /visits break;
            proxy_pass $webgis_builder;
            proxy_http_version 1.1;
            proxy_set_header Host webgis.nkua.cloud;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
        }

        location / { return 404; }
    }
}
